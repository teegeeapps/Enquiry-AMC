<div class="enquiry-header">
  <h2>📋 Enquiry Dashboard</h2>
</div>

<ng-container *ngIf="displayedColumns.length">
<app-dynamic-table
  [data]="enquiryData"
  [columns]="displayedColumns"  
  [enablePagination]="true"
  [enableFilter]="true"
  [showAssignTechnician]="true"
  [showAmcButton]="true"
  [showEditButton]="true"
  (edit)="onEditEnquiry($event)"
  (assignTechnician)="onAssignTechnician($event)"
  (amc)="onAmcUpdate($event)"
>
</app-dynamic-table>

 <!-- Show this message if no data after filtering/search -->
  <div *ngIf="enquiryData && enquiryData.length === 0" class="no-records">
    No records found
  </div>
</ng-container>


<!-- No Data Message -->
<!-- <div *ngIf="!enquiryData.length" class="no-data-message">
  <mat-icon>info</mat-icon>
  No enquiries found.
</div> -->

<!-- Floating Add Button -->
<button mat-fab color="primary" class="fab-button" (click)="addNewEnquiry()" matTooltip="Add New Enquiry">
  <mat-icon>add</mat-icon>
</button>
