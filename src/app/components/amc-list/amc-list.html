<div class="enquiry-header">
  <h2>📋 AMC</h2>
</div>

<app-dynamic-table *ngIf="amcColumns.length"
  [data]="amcData" 
  [columns]="amcColumns" 
  [enableFilter]="true" 
  [enablePagination]="true"
  [showEditButton]="true"
  (edit)="editAMC($event)"
  >
</app-dynamic-table>
