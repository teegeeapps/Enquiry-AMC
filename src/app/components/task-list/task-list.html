
  <div class="enquiry-header">
  <h2>📋 Technician View
</h2>
</div>


  <app-dynamic-table
  *ngIf="taskColumns.length"
  [data]="taskList"
  [columns]="taskColumns"
  [enablePagination]="true"
  [enableFilter]="true"
  [showEditButton]="true"
  [showDeleteButton]="true"
  (edit)="onViewtask($event)"
  (delete)="onDeletetask($event)"
 >
</app-dynamic-table>
