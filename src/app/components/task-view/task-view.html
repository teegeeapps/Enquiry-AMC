<div class="assign-wrapper mat-elevation-z4">
  <h2>Task View</h2>

  <form [formGroup]="assignForm" (ngSubmit)="onSubmit()" class="assign-grid">

    <!-- Client Name -->
    <mat-form-field appearance="outline">
      <mat-label>Client Name</mat-label>
      <input matInput formControlName="client_name" required />
    </mat-form-field>

    <!-- Contact Person -->
    <mat-form-field appearance="outline">
      <mat-label>Contact Person</mat-label>
      <input matInput formControlName="contact_person" required />
    </mat-form-field>

    <!-- Contact Number -->
    <mat-form-field appearance="outline">
      <mat-label>Contact Number</mat-label>
      <input matInput type="tel" formControlName="contact_number" required />
    </mat-form-field>

    <!-- Visit Date -->
    <mat-form-field appearance="outline">
      <mat-label>Visit Date</mat-label>
      <input matInput [matDatepicker]="visitPicker" formControlName="visit_date" required />
      <mat-datepicker-toggle matSuffix [for]="visitPicker"></mat-datepicker-toggle>
      <mat-datepicker #visitPicker></mat-datepicker>
    </mat-form-field>

    <!-- Address -->
    <mat-form-field appearance="outline">
      <mat-label>Address</mat-label>
      <textarea matInput formControlName="address" rows="2"></textarea>
    </mat-form-field>

    <!-- Delivery Instructions -->
    <mat-form-field appearance="outline">
      <mat-label>Delivery Instructions</mat-label>
      <textarea matInput formControlName="delivery_instructions" rows="2"></textarea>
    </mat-form-field>

    <!-- Customer Location -->
    <mat-form-field appearance="outline">
      <mat-label>Customer Location</mat-label>
      <input matInput formControlName="customer_location" />
    </mat-form-field>

   <!--    <mat-form-field appearance="outline">
      <mat-label>Assigned For</mat-label>
      <mat-select formControlName="assigned_for" required>
        <mat-option value="AMC">AMC</mat-option>
        <mat-option value="NEW SUPPLY">New Supply</mat-option>
        <mat-option value="SERVICE">Service</mat-option>
      </mat-select>
    </mat-form-field> -->

     <mat-form-field appearance="outline">
      <mat-label>Assigned For</mat-label>
      <input matInput formControlName="assigned_for" required readonly/>
    </mat-form-field>


    <!-- Assigned For Dropdown -->
    <mat-form-field appearance="outline" *ngIf="this.assignment.ass_type == 'REFILLING'">
      <mat-label>Completed Status</mat-label>
      <mat-select formControlName="completed_status" required>
        <mat-option value="Pending">Pending</mat-option>
        <mat-option value="Assign For Service">Assign For Service</mat-option>
        <mat-option value="Completed">Completed</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="this.assignment.ass_type !== 'REFILLING'">
      <mat-label>Completed Status</mat-label>
      <mat-select formControlName="completed_status" required>
        <mat-option value="Pending">Pending</mat-option>
        <mat-option value="Completed">Completed</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="isServicesec">
          <mat-label>Service Date</mat-label>
          <input matInput [matDatepicker]="amcPicker" formControlName="service_date" required />
          <mat-datepicker-toggle matSuffix [for]="amcPicker"></mat-datepicker-toggle>
          <mat-datepicker #amcPicker></mat-datepicker>
    </mat-form-field>

     <!-- Assigned For Dropdown -->
  <!--   <mat-form-field appearance="outline">
      <mat-label>Assigned To (Technicians)</mat-label>
      <mat-select formControlName="assigned_to" required>
       <mat-option *ngFor="let employee of employeeData" [value]="employee.employee_id">
          {{ employee.employee_name }}
        </mat-option>
      </mat-select>
    </mat-form-field> -->
 
   <!-- Assigned To Multi-Select -->
   


    <!-- Submit Button Full Width -->
    <div class="full-width submit-row">
      <button mat-raised-button color="primary" type="submit">Update</button>
    </div>

  </form>
</div>
