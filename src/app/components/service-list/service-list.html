<div class="enquiry-header">
  <h2>📋 Service Dashboard</h2>
</div>

<app-dynamic-table *ngIf="serviceColumns.length"
  [data]="serviceData" 
  [columns]="serviceColumns" 
  [enableFilter]="true" 
  [enablePagination]="true"
  [showEditButton]="true"
  [showTechAssignService]="true"
  (edit)="editService($event)"
  (assignServiceTech)="onAssignService_Tech($event)"
  >
</app-dynamic-table>
