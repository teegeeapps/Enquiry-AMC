<div class="mat-elevation-z4 dynamic-table-wrapper">

  <!-- Filter Input -->
  <div *ngIf="enableFilter" class="filter-wrapper">
    <mat-form-field appearance="outline" floatLabel="auto" class="full-width">
      <mat-label>Search</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Type to search..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <!-- ✅ Desktop View: Mat Table -->
  <div class="table-desktop" *ngIf="!isMobile">
    <mat-table [dataSource]="dataSource" matSort class="full-width mat-table-custom">

      <!-- S.No Column -->
      <ng-container matColumnDef="sno">
        <mat-header-cell *matHeaderCellDef class="table-header sno-col">S.No</mat-header-cell>
        <mat-cell *matCellDef="let row; let i = index" class="sno-col">
          {{ getSerialNumber(i) }}
        </mat-cell>
      </ng-container>

      <!-- Dynamic Columns -->
      <ng-container *ngFor="let column of columns">
        <ng-container *ngIf="column !== 'Actions'" [matColumnDef]="column">
          <mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">
            {{ column | formatHeader }}
          </mat-header-cell>
          <mat-cell *matCellDef="let row">
           <!--  {{ row[column] }} -->
              <!-- If column is map_location, render as clickable link -->
      <ng-container *ngIf="column === 'customer_location'; else normalCell">
        <a [href]="row[column]" target="_blank" rel="noopener noreferrer">
          View Location
        </a>
      </ng-container>

      <!-- Default cell -->
      <ng-template #normalCell>
        {{ row[column] }}
      </ng-template>
          </mat-cell>
        </ng-container>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="Actions">
        <mat-header-cell *matHeaderCellDef class="table-header">Actions</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <button *ngIf="showEditButton" mat-icon-button color="accent" (click)="onEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>

          <button *ngIf="showDeleteButton" mat-icon-button color="accent" (click)="onDelete(row)">
            <mat-icon>delete</mat-icon>
          </button>

          <button *ngIf="showViewButton" mat-icon-button color="warn" (click)="onView(row)">
          <mat-icon>visibility</mat-icon>
        </button>

          <!-- Assign Technician button -> only if row.status_name === 'Order Confirmed' -->
          <button *ngIf="showAssignTechnician && (row.status_name === 'Order Confirmed' || row.status_name === 'Order Delivered')" mat-icon-button color="warn"
            (click)="onAssignTechnician(row)">
            <mat-icon>person</mat-icon>
          </button>

          <button *ngIf="showTechAssignAMC" mat-icon-button color="warn"
            (click)="onAssignTech(row)">
            <mat-icon>person</mat-icon>
          </button>

          <button *ngIf="showAmcButton && row.status_name === 'Order Delivered'" color="primary" (click)="onAmc(row)"  mat-icon-button color="blue">
            <mat-icon>settings</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <!-- No Data Row -->
      <mat-row *matNoDataRow>
        <mat-cell [attr.colspan]="columns.length + 1" style="text-align:center;">
          No data found.
        </mat-cell>
      </mat-row>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
    </mat-table>
  </div>

  <!-- ✅ Mobile View: Card Layout -->
  <div class="table-mobile" *ngIf="isMobile">
    <mat-card *ngFor="let row of dataSource.data; let i = index" class="row-card">
      <mat-card-content>
        <div class="row-item"><strong>S.No:</strong> {{ getSerialNumber(i) }}</div>

        <div *ngFor="let column of columns" class="row-item">
          <strong>{{ column | formatHeader }}:</strong> 
          
          <!-- {{ row[column] }} -->
            <ng-container *ngIf="column === 'customer_location'; else normalCardCell">
            <a [href]="row[column]" target="_blank" rel="noopener noreferrer">
              View Location
            </a>
          </ng-container>

          <ng-template #normalCardCell>
            {{ row[column] }}
          </ng-template>
        </div>

        <!-- Actions -->
        <div class="row-item actions">
          <button mat-icon-button color="accent" (click)="onEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <!--   <button *ngIf="showAssignTechnician" mat-icon-button color="warn" (click)="onAssignTechnician(row)">
            <mat-icon>person</mat-icon>
          </button> -->

          <!-- Assign Technician only if status_name = Order Confirmed -->
          <button *ngIf="showAssignTechnician && (row.status_name === 'Order Confirmed' || row.status_name === 'Order Delivered')" mat-icon-button color="warn"
            (click)="onAssignTechnician(row)">
            <mat-icon>person</mat-icon>
          </button>
          <button *ngIf="showTechAssignAMC" mat-icon-button color="warn"
            (click)="onAssignTech(row)">
            <mat-icon>person</mat-icon>
          </button>
          <button *ngIf="showAmcButton" mat-stroked-button color="primary" (click)="onAmc(row)">
            <mat-icon>settings</mat-icon>
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Paginator -->
  <mat-paginator *ngIf="enablePagination" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
  </mat-paginator>
</div>
